# Жесткий стоп-лист для русского технического текста.
#
# Единый источник правды: этот файл читают и skill `writing` (мягкая проверка в
# сессии через scripts/lint_banned_terms.py), и внешний gate (git pre-commit),
# когда он будет добавлен. Не дублируй список в Markdown - `technical-terminology.md`
# ссылается сюда.
#
# Семантика `patterns`: каждая строка - основа (regex). Линтер компилирует ее как
#   (?iu)(?<![а-яё])(<pattern>)[а-яё]*
# то есть якорит по левой границе слова и разрешает любой русский суффиксальный
# хвост. Для существительного-кальки достаточно одной основы (склонение не меняет
# основу); для глагольных дериватов с приставкой добавляй отдельную основу.
#
# `replacement` - что писать вместо; при нескольких вариантах перечисляй через
# запятую, выбор по смыслу остается за автором.

[[term]]
id          = "provisioning"
patterns    = ["провижинг", "за?провиж(ить|у|ишь|ил|енн)"]
replacement = "выделение ресурсов, подготовка окружения или предоставление доступа"
note        = "транслитерированная калька provisioning"
